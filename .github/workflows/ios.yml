name: iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Platforma papkalarini yaratish
        run: flutter create --platforms=ios --project-name=getcontact .

      - name: iOS sozlamalarini qo'llash
        run: bash tool/patch_ios.sh

      - name: Paketlar
        run: flutter pub get

      - name: Ikonka va yuklash ekrani
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: CocoaPods
        run: cd ios && pod install --repo-update

      - name: IPA yig'ish (imzosiz)
        run: |
          flutter build ios --release --no-codesign

      - name: IPA arxivlash
        run: |
          mkdir -p build/ios-payload/Getcontact.app
          cp -r build/ios/iphoneos/Runner.app build/ios-payload/Getcontact.app/
          cd build/ios-payload
          zip -r ../Getcontact.ipa .
          echo "IPA tayyor: build/Getcontact.ipa"

      - name: IPA'ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: getcontact-ipa
          path: build/Getcontact.ipa
