name: iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Platforma papkalarini yaratish
        run: flutter create --platforms=ios --project-name=getcontact .

      - name: iOS sozlamalarini qo'llash
        run: bash tool/patch_ios.sh

      - name: Paketlar
        run: flutter pub get

      # DIQQAT: pubspec.yaml dagi konfiguratsiya Android uchun mo'ljallangan.
      # Bu runner'da android/ papkasi yo'q, shuning uchun iOS'ning
      # o'z konfiguratsiya fayllarini ishlatamiz (-f / --path).
      - name: Ikonka va yuklash ekrani (faqat iOS)
        run: |
          dart run flutter_launcher_icons -f tool/icons_ios.yaml
          dart run flutter_native_splash:create --path=tool/splash_ios.yaml

      # Podfile ba'zi Flutter versiyalarida faqat "pub get" dan keyin
      # paydo bo'ladi, shuning uchun skriptni qayta chaqiramiz (idempotent):
      # local_auth iOS 13+ talab qiladi.
      - name: iOS minimal versiyasini tasdiqlash
        run: bash tool/patch_ios.sh

      - name: CocoaPods
        run: cd ios && pod install --repo-update

      # iPhone caller ID (Jizzax): Call Directory extension target'i.
      # xcodeproj gem'i CocoaPods bilan birga keladi; bo'lmasa o'rnatamiz.
      - name: Call Directory extension
        run: |
          ruby -e "require 'xcodeproj'" 2>/dev/null || gem install --user-install --no-document xcodeproj
          ruby tool/ios/add_call_directory.rb

      # DIQQAT: Flutter muvaffaqiyatsiz build'da ko'pincha "Development Team
      # kerak" degan CHALG'ITUVCHI xabarni ko'rsatadi — haqiqiy Xcode xatosi
      # oddiy chiqishda butunlay yashiriladi (flutter/flutter#113203).
      # Shuning uchun -v bilan yig'amiz va xato bo'lsa asl sababni ajratamiz.
      - name: IPA yig'ish (imzosiz)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign -v 2>&1 \
            | tee ios-build.log && ok=1 || ok=0

          if [ "$ok" = "0" ]; then
            echo "═════════════ HAQIQIY XATO ═════════════"
            grep -nE "error:|fatal error|No such module|Undefined symbol|minimum deployment target|BUILD FAILED|The following build commands failed" \
              ios-build.log | tail -60 || echo "(aniq xato qatori topilmadi)"
            echo "═════════════ oxirgi 100 qator ═════════════"
            tail -100 ios-build.log
            exit 1
          fi

      # Xato bo'lsa to'liq log kerak bo'ladi — har holda saqlab qo'yamiz
      - name: Build logini saqlash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios-build.log
          if-no-files-found: ignore

      # --no-codesign bilan entitlements (App Group) ilovaga yozilmaydi.
      # Ad-hoc imzo bilan ularni ichiga joylaymiz — qayta imzolovchi
      # dasturlar (AltStore, Sideloadly) App Group'ni shundan oladi.
      - name: Entitlements (ad-hoc imzo)
        run: |
          APP=build/ios/iphoneos/Runner.app
          APPEX="$APP/PlugIns/CallDirectory.appex"
          test -d "$APPEX" || { echo "❌ CallDirectory.appex ilovada yo'q"; ls -la "$APP" "$APP/PlugIns" || true; exit 1; }
          find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) \
            -exec codesign -f -s - {} \;
          codesign -f -s - --entitlements ios/CallDirectory/CallDirectory.entitlements "$APPEX"
          codesign -f -s - --entitlements ios/Runner/Runner.entitlements "$APP"
          echo "── Runner entitlements:"; codesign -d --entitlements - "$APP" 2>/dev/null | tail -n +1
          echo "── Extension entitlements:"; codesign -d --entitlements - "$APPEX" 2>/dev/null | tail -n +1
          plutil -p "$APPEX/Info.plist" | grep -E 'CFBundleIdentifier|NSExtensionPointIdentifier|CFBundleShortVersionString'

      - name: IPA arxivlash
        run: |
          # IPA — bu ichida "Payload/<Ilova>.app" bo'lgan oddiy zip arxiv.
          # Papka nomi aynan "Payload" bo'lishi shart, aks holda
          # Sideloadly / AltStore uni o'rnata olmaydi.
          rm -rf build/ipa-work
          mkdir -p build/ipa-work/Payload
          cp -r build/ios/iphoneos/Runner.app build/ipa-work/Payload/
          cd build/ipa-work
          zip -qr ../Getcontact.ipa Payload
          cd ..
          ls -lh Getcontact.ipa
          echo "IPA tayyor: build/Getcontact.ipa"

      - name: IPA'ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: getcontact-ipa
          path: build/Getcontact.ipa
